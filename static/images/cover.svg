<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blurLight"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f2ede4"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d2c5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c8c0b0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b0a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a89f8e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- 太阳 / 月亮 -->
  <circle cx="950" cy="120" r="45" fill="#e8d5c0" opacity="0.4"/>

  <!-- 远山 -->
  <path d="M0 280 Q150 180 300 240 T600 200 T900 230 T1200 210 L1200 500 L0 500 Z" fill="url(#mountainFar)"/>
  <path d="M0 340 Q200 260 400 310 T700 280 T1000 300 T1200 290 L1200 500 L0 500 Z" fill="url(#mountainNear)"/>

  <!-- 云雾 -->
  <path d="M100 220 Q300 190 500 220 T900 200 T1200 210" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.3" filter="url(#blur)"/>
  <path d="M200 270 Q400 250 600 270 T1000 250" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.2" filter="url(#blurLight)"/>

  <!-- 飞鸟 -->
  <g fill="none" stroke="#8c8374" stroke-width="1.5" opacity="0.4">
    <path d="M820 140 Q828 132 836 140 Q844 132 852 140"/>
    <path d="M850 120 Q856 114 862 120 Q868 114 874 120"/>
    <path d="M800 160 Q806 154 812 160 Q818 154 824 160"/>
  </g>

  <!-- 竹子：左侧 -->
  <g opacity="0.8">
    <path d="M80 150 Q90 300 80 500" fill="none" stroke="#6b8e6b" stroke-width="6" stroke-linecap="round"/>
    <path d="M110 180 Q115 320 110 500" fill="none" stroke="#5a7d5a" stroke-width="4" stroke-linecap="round"/>
    <path d="M77 250 L83 250 M77 350 L83 350 M77 430 L83 430" stroke="#6b8e6b" stroke-width="3"/>
    <path d="M80 180 Q100 165 115 180 Q95 195 80 180 Z" fill="#6b8e6b" opacity="0.7"/>
    <path d="M80 200 Q105 190 115 205 Q95 218 80 200 Z" fill="#6b8e6b" opacity="0.6"/>
    <path d="M110 220 Q130 205 145 220 Q125 235 110 220 Z" fill="#5a7d5a" opacity="0.6"/>
    <path d="M80 300 Q50 285 35 300 Q55 315 80 300 Z" fill="#6b8e6b" opacity="0.5"/>
  </g>

  <!-- 竹子：右侧 -->
  <g opacity="0.7">
    <path d="M1120 180 Q1110 320 1120 500" fill="none" stroke="#5a7d5a" stroke-width="5" stroke-linecap="round"/>
    <path d="M1145 220 Q1140 350 1145 500" fill="none" stroke="#6b8e6b" stroke-width="3" stroke-linecap="round"/>
    <path d="M1117 300 L1123 300 M1117 400 L1123 400" stroke="#5a7d5a" stroke-width="2.5"/>
    <path d="M1120 240 Q1090 225 1075 240 Q1095 255 1120 240 Z" fill="#5a7d5a" opacity="0.6"/>
    <path d="M1120 260 Q1095 255 1080 270 Q1100 285 1120 260 Z" fill="#5a7d5a" opacity="0.5"/>
    <path d="M1145 280 Q1165 265 1180 280 Q1160 295 1145 280 Z" fill="#6b8e6b" opacity="0.5"/>
  </g>

  <!-- 学者剪影：左下角，坐姿读书 -->
  <g transform="translate(180, 360)">
    <ellipse cx="0" cy="60" rx="45" ry="12" fill="#a89f8e" opacity="0.5"/>
    <path d="M -15 50 L -10 0 Q 0 -15 10 0 L 15 50 Z" fill="#4a4a4a" opacity="0.8"/>
    <circle cx="0" cy="-18" r="12" fill="#4a4a4a" opacity="0.8"/>
    <circle cx="0" cy="-30" r="5" fill="#4a4a4a" opacity="0.8"/>
    <path d="M 10 10 L 35 5 L 40 15 L 15 20 Z" fill="#f0ead6" stroke="#8c8374" stroke-width="1" opacity="0.9"/>
    <path d="M 15 12 L 38 8" stroke="#8c8374" stroke-width="0.8" opacity="0.6"/>
    <path d="M 10 0 Q 20 5 25 10" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 文字：右上角，低调辅助 -->
  <g opacity="0.8">
    <text x="1100" y="70" font-size="28" font-family="'KaiTi', 'STKaiti', 'Noto Serif SC', 'Songti SC', serif" fill="#6b5e4e" text-anchor="end" letter-spacing="4">荀子 · 劝学</text>
    <line x1="980" y1="85" x2="1100" y2="85" stroke="#c43b33" stroke-width="1" opacity="0.3"/>
    <text x="1100" y="110" font-size="16" font-family="'SimSun', 'STSong', 'Noto Serif SC', 'Songti SC', serif" fill="#8c8374" text-anchor="end" letter-spacing="2">不积跬步，无以至千里</text>
    <text x="1100" y="134" font-size="16" font-family="'SimSun', 'STSong', 'Noto Serif SC', 'Songti SC', serif" fill="#8c8374" text-anchor="end" letter-spacing="2">不积小流，无以成江海</text>
  </g>

  <!-- 主印章：随机不规则椭圆，刚好包裹汉字 -->
  <g transform="translate(1080, 190) rotate(-3)">
    <!-- 印章底色：随机不规则椭圆路径 -->
    <path d="M -22 -12 C -16 -26, 14 -28, 23 -14 C 29 -5, 27 12, 16 22 C 7 28, -14 26, -21 14 C -27 6, -29 -3, -22 -12 Z" fill="#c43b33" opacity="0.9"/>
    
    <!-- 印泥不均匀的细微纹理 -->
    <path d="M -18 -10 C -13 -22, 11 -23, 19 -12 C 24 -4, 22 9, 13 17 C 5 22, -11 20, -17 11 C -22 4, -23 -3, -18 -10 Z" fill="none" stroke="#fdfbf7" stroke-width="0.5" opacity="0.2"/>
    
    <!-- 印章文字（劝学） -->
    <text x="0" y="-4" font-size="16" font-family="'KaiTi', 'STKaiti', 'Noto Serif SC', serif" fill="#fdfbf7" text-anchor="middle" font-weight="bold">劝</text>
    <text x="0" y="16" font-size="16" font-family="'KaiTi', 'STKaiti', 'Noto Serif SC', serif" fill="#fdfbf7" text-anchor="middle" font-weight="bold">学</text>
  </g>
</svg>