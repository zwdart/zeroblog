<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 夜空：以月亮为光源的径向渐变，但整体柔和 -->
    <radialGradient id="sky" cx="880" cy="140" r="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3E526A"/>
      <stop offset="25%" stop-color="#2A3A52"/>
      <stop offset="55%" stop-color="#1A2638"/>
      <stop offset="82%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </radialGradient>

    <!-- 月亮光晕：明显减弱 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#FFF8E0" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#FFF8E0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>

    <!-- 主峰：底部纯暗，朝月侧微受光 -->
    <linearGradient id="mainMountain" x1="0.4" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#26364C"/>
      <stop offset="50%" stop-color="#141E2C"/>
      <stop offset="100%" stop-color="#080D14"/>
    </linearGradient>

    <!-- 左侧次峰 -->
    <linearGradient id="leftMountain" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1B2638"/>
      <stop offset="100%" stop-color="#080D14"/>
    </linearGradient>

    <!-- 右侧次峰 -->
    <linearGradient id="rightMountain" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E4058"/>
      <stop offset="55%" stop-color="#18222F"/>
      <stop offset="100%" stop-color="#080D14"/>
    </linearGradient>

    <!-- 远山 -->
    <linearGradient id="farMountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2C40"/>
      <stop offset="100%" stop-color="#141E2C"/>
    </linearGradient>

    <!-- 水面月光柱：更弱 -->
    <linearGradient id="moonPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#FFF8E0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </linearGradient>

    <!-- 水面 -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121B28"/>
      <stop offset="100%" stop-color="#070C12"/>
    </linearGradient>

    <!-- 笔触柔化 -->
    <filter id="softBrush" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- 夜空 -->
  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- 星点：随机分布，远离月亮处更明显 -->
  <g fill="#DCE6F0">
    <circle cx="68"  cy="52"  r="1.2" opacity="0.7"/>
    <circle cx="142" cy="178" r="0.8" opacity="0.4"/>
    <circle cx="228" cy="38"  r="1"   opacity="0.6"/>
    <circle cx="315" cy="132" r="0.7" opacity="0.35"/>
    <circle cx="402" cy="62"  r="1.1" opacity="0.55"/>
    <circle cx="478" cy="196" r="0.6" opacity="0.28"/>
    <circle cx="548" cy="42"  r="0.9" opacity="0.45"/>
    <circle cx="628" cy="148" r="0.7" opacity="0.3"/>
    <circle cx="694" cy="72"  r="0.9" opacity="0.35"/>
    <circle cx="112" cy="242" r="0.6" opacity="0.25"/>
    <circle cx="272" cy="222" r="0.8" opacity="0.32"/>
    <circle cx="448" cy="258" r="0.5" opacity="0.2"/>
    <circle cx="1042" cy="52" r="0.7" opacity="0.25"/>
    <circle cx="1118" cy="188" r="0.6" opacity="0.2"/>
    <circle cx="760" cy="228" r="0.7" opacity="0.28"/>
    <circle cx="980" cy="240" r="0.5" opacity="0.18"/>
  </g>

  <!-- 月亮光晕（弱） -->
  <circle cx="880" cy="140" r="160" fill="url(#moonGlow)"/>

  <!-- 月亮：亮度减弱，边缘柔化 -->
  <circle cx="880" cy="140" r="24" fill="#E8E2CC" opacity="0.85"/>
  <circle cx="872" cy="132" r="4.5" fill="#D4CCB4" opacity="0.55"/>
  <circle cx="889" cy="148" r="3.5" fill="#D4CCB4" opacity="0.45"/>
  <circle cx="878" cy="151" r="2.2" fill="#D4CCB4" opacity="0.35"/>

  <!-- 飞鸟：疏密不均，姿态随机 -->
  <g stroke="#8FA6BE" fill="none" opacity="0.5">
    <path d="M 640 168 Q 650 158 660 168 Q 670 158 680 168" stroke-width="1.2" opacity="0.5"/>
    <path d="M 700 198 Q 707 192 714 198 Q 721 192 728 198" stroke-width="1" opacity="0.35"/>
    <path d="M 572 218 Q 578 212 584 218 Q 590 212 596 218" stroke-width="0.9" opacity="0.25"/>
  </g>

  <!-- 远山：更高频、更随机的起伏 -->
  <path d="M 0 408
           L 38 388 L 72 398 L 118 376 L 162 392 L 208 368
           L 256 385 L 302 362 L 355 380 L 405 358 L 458 378
           L 508 356 L 562 374 L 612 354 L 668 372 L 718 352
           L 775 370 L 828 350 L 885 370 L 940 354 L 998 372
           L 1052 354 L 1112 374 L 1165 358 L 1200 368
           L 1200 468 L 0 468 Z"
        fill="url(#farMountain)" opacity="0.55"/>

  <!-- 左侧次峰：矮、偏、暗，山脊不规则 -->
  <path d="M 22 468
           L 68 420 L 92 434
           L 124 384 L 148 402
           L 178 348 L 200 372
           L 228 322 L 252 350
           L 278 388 L 302 410
           L 328 442 L 352 468 Z"
        fill="url(#leftMountain)"/>

  <!-- 主峰：峰顶偏右，左右坡度不对称，山脊起伏随机 -->
  <path d="M 180 468
           L 248 406 L 274 424
           L 322 342 L 344 366
           L 388 282 L 412 308
           L 446 218 L 466 172
           L 486 118 L 508 162
           L 528 208 L 556 258
           L 590 306 L 622 344
           L 652 378 L 684 414
           L 714 444 L 744 468 Z"
        fill="url(#mainMountain)"/>

  <!-- 主峰受光边缘：淡描边，弱 -->
  <path d="M 486 118 L 508 162 L 528 208 L 556 258 L 590 306 L 622 344 L 652 378 L 684 414 L 714 444 L 744 468"
        stroke="#5A7898" stroke-width="1.1" fill="none" opacity="0.4"/>
  <path d="M 486 118 L 466 172 L 446 218 L 412 308"
        stroke="#33465E" stroke-width="0.9" fill="none" opacity="0.3"/>

  <!-- 右侧次峰：离月最近，微弱受光 -->
  <path d="M 716 468
           L 758 420 L 782 436
           L 818 384 L 842 406
           L 874 354 L 896 378
           L 924 412 L 950 438
           L 978 468 Z"
        fill="url(#rightMountain)"/>
  <path d="M 874 354 L 896 378 L 924 412 L 950 438 L 978 468"
        stroke="#6888A8" stroke-width="1.1" fill="none" opacity="0.45"/>

  <!-- 右侧更远的小山丘 -->
  <path d="M 986 468 L 1014 428 L 1038 446 L 1064 412 L 1088 436 L 1118 468 Z"
        fill="url(#rightMountain)" opacity="0.8"/>
  <path d="M 1064 412 L 1088 436 L 1118 468"
        stroke="#5A7898" stroke-width="0.9" fill="none" opacity="0.35"/>

  <!-- 山体皴纹：笔触更自由，长短错落 -->
  <g fill="none" filter="url(#softBrush)">
    <path d="M 486 118 L 458 205 L 470 298" stroke="#3E5678" stroke-width="1" opacity="0.4"/>
    <path d="M 486 118 L 516 196 L 506 282" stroke="#527088" stroke-width="1" opacity="0.45"/>
    <path d="M 486 118 L 438 248 L 450 348" stroke="#2E4258" stroke-width="0.9" opacity="0.32"/>
    <path d="M 322 342 L 335 396 L 346 440" stroke="#2E4258" stroke-width="0.8" opacity="0.32"/>
    <path d="M 874 354 L 886 404 L 896 448" stroke="#527088" stroke-width="1" opacity="0.45"/>
    <path d="M 178 348 L 190 396 L 202 438" stroke="#26364C" stroke-width="0.7" opacity="0.3"/>
    <path d="M 590 306 L 600 352 L 610 400" stroke="#3E5678" stroke-width="0.9" opacity="0.32"/>
    <path d="M 652 378 L 660 418 L 668 452" stroke="#2E4258" stroke-width="0.7" opacity="0.28"/>
    <path d="M 1064 412 L 1074 444 L 1082 462" stroke="#3E5678" stroke-width="0.7" opacity="0.3"/>
  </g>

  <!-- 水面 -->
  <rect x="0" y="448" width="1200" height="52" fill="url(#water)"/>

  <!-- 水面月光倒影柱：弱 -->
  <path d="M 852 448 L 912 448 L 920 500 L 844 500 Z"
        fill="url(#moonPath)"/>

  <!-- 水面波纹：长短不一，疏密随机 -->
  <g stroke="#2E4058" fill="none">
    <path d="M 48 456 Q 118 453 188 456" stroke-width="0.9" opacity="0.45"/>
    <path d="M 228 464 Q 298 461 368 464" stroke-width="0.8" opacity="0.35"/>
    <path d="M 398 456 Q 458 453 518 456" stroke-width="0.9" opacity="0.4"/>
    <path d="M 558 465 Q 628 462 698 465" stroke-width="0.8" opacity="0.3"/>
    <path d="M 608 454 Q 660 452 712 454" stroke-width="0.7" opacity="0.28"/>
    <path d="M 768 458 Q 812 455 856 458" stroke-width="0.8" opacity="0.38"/>
    <path d="M 948 464 Q 1002 461 1056 464" stroke-width="0.8" opacity="0.35"/>
    <path d="M 88 474 Q 168 471 248 474" stroke-width="0.7" opacity="0.28"/>
    <path d="M 838 476 Q 888 474 938 476" stroke-width="0.8" opacity="0.4"/>
    <path d="M 1008 472 Q 1068 469 1128 472" stroke-width="0.7" opacity="0.3"/>
    <path d="M 320 482 Q 380 480 440 482" stroke-width="0.6" opacity="0.22"/>
    <path d="M 1128 480 Q 1172 478 1200 480" stroke-width="0.6" opacity="0.2"/>
  </g>

  <!-- 月光明暗线 -->
  <path d="M 0 448 Q 180 445 360 448 T 720 448 T 1080 449 L 1200 449"
        stroke="#3E5468" stroke-width="0.9" fill="none" opacity="0.4"/>

  <!-- 水中石头：大小、位置、明暗都随机 -->
  <g>
    <path d="M 786 454 L 806 438 L 830 443 L 848 454 Z"
          fill="#0A1018" stroke="#527088" stroke-width="0.8"/>
    <path d="M 862 460 L 880 448 L 900 452 L 914 460 Z"
          fill="#0A1018" stroke="#46608A" stroke-width="0.7" opacity="0.95"/>
    <path d="M 926 458 L 940 449 L 956 452 L 966 458 Z"
          fill="#0A1018" stroke="#46608A" stroke-width="0.6" opacity="0.88"/>
    <path d="M 660 458 L 680 446 L 704 450 L 720 458 Z"
          fill="#080D14" stroke="#2E4058" stroke-width="0.7" opacity="0.75"/>
    <path d="M 496 460 L 510 451 L 526 454 L 538 460 Z"
          fill="#080D14" stroke="#2E4058" stroke-width="0.6" opacity="0.65"/>
    <path d="M 1044 460 L 1056 452 L 1070 455 L 1080 460 Z"
          fill="#0A1018" stroke="#3E5468" stroke-width="0.5" opacity="0.6"/>
    <path d="M 596 462 L 606 456 L 618 458 L 626 462 Z"
          fill="#080D14" stroke="#26364C" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- 水面月光细闪：稀疏、位置随机 -->
  <g fill="#FFF8E0">
    <rect x="866" y="454" width="12" height="1" rx="0.5" opacity="0.28"/>
    <rect x="878" y="462" width="18" height="1" rx="0.5" opacity="0.35"/>
    <rect x="858" y="470" width="24" height="1" rx="0.5" opacity="0.25"/>
    <rect x="872" y="478" width="14" height="1" rx="0.5" opacity="0.2"/>
    <rect x="884" y="488" width="8"  height="1" rx="0.5" opacity="0.14"/>
  </g>
</svg>